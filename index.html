<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shotbyjaheim_ | sideline photography</title>
<meta name="description" content="Game day football photography. Broward County, FL.">
<style>
  :root { --red:#D7262F; --gold:#F2B233; --bg:#0B0B0F; --card:#131318;
          --line:#26262C; --dim:#9A9AA4; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:#F2F2F4;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
         line-height:1.6; -webkit-font-smoothing:antialiased; }
  a { color:inherit; }

  header { padding:64px 22px 40px; text-align:center; }
  header h1 { margin:0 0 10px; font-size:clamp(34px,11vw,64px); letter-spacing:-1px;
              font-weight:800; }
  header p { margin:0 0 26px; color:var(--dim); font-size:15px; letter-spacing:3px;
             text-transform:uppercase; }
  .btns { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .btn { text-decoration:none; font-weight:700; font-size:14px; letter-spacing:2px;
         padding:14px 22px; border-radius:10px; }
  .btn.solid { background:var(--red); color:#fff; }
  .btn.ghost { border:1px solid var(--line); color:#F2F2F4; }

  .gallery { display:grid; gap:10px; padding:26px 10px 60px;
             grid-template-columns:1fr; max-width:1100px; margin:0 auto; }
  @media (min-width:620px) { .gallery { grid-template-columns:1fr 1fr; } }
  @media (min-width:980px) { .gallery { grid-template-columns:1fr 1fr 1fr; } }
  .gallery img { width:100%; display:block; border-radius:10px; background:var(--card);
                 cursor:zoom-in; aspect-ratio:4/5; object-fit:cover; }

  .empty { color:var(--dim); text-align:center; padding:60px 22px; font-size:15px; }

  footer { border-top:1px solid var(--line); padding:34px 22px 60px; text-align:center; }
  footer p { margin:0 0 8px; color:var(--dim); font-size:14px; }
  footer a { color:var(--gold); }

  .lb { position:fixed; inset:0; background:rgba(0,0,0,.94); display:none;
        align-items:center; justify-content:center; z-index:50; }
  .lb.on { display:flex; }
  .lb img { max-width:94vw; max-height:88vh; border-radius:6px; }
  .lb button { position:absolute; background:none; border:none; color:#fff;
               font-size:34px; cursor:pointer; padding:16px; line-height:1; }
  .lb .x { top:6px; right:10px; font-size:28px; }
  .lb .prev { left:4px; } .lb .next { right:4px; }
</style>
</head>
<body>

<header>
  <h1>SHOTBYJAHEIM</h1>
  <p>Sideline photography &middot; Broward County</p>
  <div class="btns">
    <a class="btn solid" href="https://instagram.com/shotbyjaheim_">BOOK ON INSTAGRAM</a>
    <a class="btn ghost" href="policy.html">PHOTO POLICY</a>
  </div>
</header>

<div class="gallery" id="gallery"></div>

<footer>
  <p>Game day photos. 3 for $5 &middot; 5 for $10 &middot; 10 for $15</p>
  <p><a href="https://instagram.com/shotbyjaheim_">@shotbyjaheim_</a></p>
</footer>

<div class="lb" id="lb">
  <button class="x" aria-label="Close">&times;</button>
  <button class="prev" aria-label="Previous">&#8249;</button>
  <img id="lbimg" alt="">
  <button class="next" aria-label="Next">&#8250;</button>
</div>

<script>
// Add each photo's filename here. Upload the files to the same folder
// as this page, then paste the name in the list below.
const PHOTOS = [
  "IMG_1140 (1).png"
];

const gallery = document.getElementById('gallery');
const lb = document.getElementById('lb');
const lbimg = document.getElementById('lbimg');
let idx = 0;

if (!PHOTOS.length) {
  gallery.outerHTML = '<p class="empty">Photos coming after Thursday\u2019s game.</p>';
} else {
  PHOTOS.forEach(function (name, i) {
    const img = document.createElement('img');
    img.src = encodeURI(name);
    img.alt = 'Football photo by shotbyjaheim_';
    img.loading = 'lazy';
    img.addEventListener('click', function () { open(i); });
    gallery.appendChild(img);
  });
}

function open(i) {
  idx = (i + PHOTOS.length) % PHOTOS.length;
  lbimg.src = encodeURI(PHOTOS[idx]);
  lb.classList.add('on');
}
function close() { lb.classList.remove('on'); }

lb.querySelector('.x').addEventListener('click', close);
lb.querySelector('.prev').addEventListener('click', function (e) {
  e.stopPropagation(); open(idx - 1);
});
lb.querySelector('.next').addEventListener('click', function (e) {
  e.stopPropagation(); open(idx + 1);
});
lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
document.addEventListener('keydown', function (e) {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') close();
  if (e.key === 'ArrowLeft') open(idx - 1);
  if (e.key === 'ArrowRight') open(idx + 1);
});
</script>
</body>
</html>
